{% extends "base.html" %}

{% block title %}Upload File — ClearCage{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="text-center mb-6">
        <h1 class="text-3xl font-bold">Analyze File</h1>
        <p class="text-base-content/60">Upload a suspicious file for containerized analysis</p>
    </div>

    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <!-- Drop Zone -->
            <form hx-post="/api/analyze/file" hx-encoding="multipart/form-data"
                  hx-target="#result-area" hx-indicator="#upload-spinner"
                  id="upload-form">
                <div class="form-control w-full">
                    <label class="label"><span class="label-text font-semibold">File</span></label>

                    <!-- Drop zone -->
                    <div class="border-2 border-dashed border-base-content/30 rounded-lg p-8 text-center"
                         id="drop-zone">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-base-content/40 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-base-content/60">Drag & drop or click to browse</p>
                        <p class="text-xs text-base-content/40 mt-1">Max 50MB — PE, Office, PDF, Scripts</p>
                        <input type="file" name="file" id="file-input" class="file-input file-input-bordered w-full mt-4" required>
                    </div>
                </div>

                <div class="card-actions mt-6 justify-end">
                    <a href="/" class="btn btn-ghost btn-sm">Cancel</a>
                    <span id="upload-spinner" class="htmx-indicator loading loading-spinner loading-sm"></span>
                    <button type="submit" class="btn btn-primary">Analyze File</button>
                </div>
            </form>

            <!-- Result Area -->
            <div id="result-area" class="mt-4"></div>
        </div>
    </div>
</div>
{% endblock %}
